# Multi-tenant SaaS MVP stack (author/fork: cesar-andress).
# Usage: docker compose up --build

services:
  # ==========================================
  # 1. Primary database (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 2. Central API (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=saas_db
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - STORAGE_BASE_PATH=/app/vm_storage
      - FRONTEND_TRANSFER_URL=http://app.saas.local
      - INTEGRITY_ENABLED=true
      - INTEGRITY_API_BASE_URL=http://integrity-stub:8090
      - INTEGRITY_SHARED_TOKEN=demo-integrity-token
    volumes:
      - ./backend:/app
      # Per-tenant storage roots (logical "VM" folders)
      - ./vm_storage:/app/vm_storage
    depends_on:
      - db
      - mailhog
      - integrity-stub
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 2b. Integrity stub (Alessa replaces this URL with her IVS)
  # ==========================================
  integrity-stub:
    build:
      context: ./services/integrity-stub
      dockerfile: Dockerfile
    container_name: saas_integrity_stub
    ports:
      - "8090:8090"
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 3. WordPress + WooCommerce (shop / webhooks)
  # ==========================================
  wp_db:
    image: mysql:8.0
    container_name: saas_wp_mysql
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wp_user
      - MYSQL_PASSWORD=wp_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - wp_db_data:/var/lib/mysql
    networks:
      - saas_network
    restart: always

  wordpress:
    image: wordpress:latest
    container_name: saas_wordpress
    ports:
      - "8080:80"
    environment:
      - WORDPRESS_DB_HOST=wp_db:3306
      - WORDPRESS_DB_USER=wp_user
      - WORDPRESS_DB_PASSWORD=wp_password
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wp_db
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 4. Unified frontend (admin + file transfer)
  # ==========================================
  frontend:
    image: node:20-alpine
    container_name: saas_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api.saas.local/api/v1
    depends_on:
      - backend
    networks:
      - saas_network

  # ==========================================
  # 5. Observability (Prometheus + Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: saas_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - saas_network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: saas_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 6. Local SMTP sink for demos (MailHog)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: saas_mailhog
    ports:
      - "1025:1025" # Puerto SMTP para que FastAPI/WordPress envíen correos
      - "8025:8025" # Interfaz web para ver los correos recibidos
    networks:
      - saas_network
    restart: always

  # ==========================================
  # 7. Reverse proxy (*.saas.local)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: saas_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
  wp_db_data:
  wp_data:
  grafana_data:

networks:
  saas_network:
    driver: bridge