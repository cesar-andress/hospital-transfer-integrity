# Reverse proxy for local *.saas.local hostnames.
# Upstream targets use host.docker.internal so Nginx can reach published host ports.

events {}

http {
  server {
    listen 80;
    server_name tienda.saas.local;
    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name app.saas.local;
    location / {
      proxy_pass http://host.docker.internal:5173;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  server {
    listen 80;
    server_name api.saas.local;
    location / {
      proxy_pass http://host.docker.internal:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name grafana.saas.local;
    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name mail.saas.local;
    location / {
      proxy_pass http://host.docker.internal:8025;
      proxy_set_header Host $host;
    }
  }
}
