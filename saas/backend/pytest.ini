[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unit: fast tests without the full product stack (helpers, schema static checks)
    acceptance: executable product spec (may contain xfail for features not built yet)
    db: needs PostgreSQL (TEST_DATABASE_URL or a local initdb/pg_ctl); skipped otherwise
    static: inspects repo files (nginx.conf, docker-compose.yml, frontend routes); no DB needed
xfail_strict = true
filterwarnings =
    ignore::UserWarning:jwt.*
    ignore:The HMAC key:Warning
    ignore::DeprecationWarning
    ignore:Using `httpx`:Warning
